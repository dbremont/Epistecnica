<script>
"use strict";

/* ──────────────────────────────────────────────────────────
   utilities
   ────────────────────────────────────────────────────────── */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rf = (a, b, d) => +(a + Math.random() * (b - a)).toFixed(d === undefined ? 2 : d);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function fmt(v, d) {
  if (!Number.isFinite(v)) return '—';
  d = d === undefined ? 2 : d;
  let s = v.toFixed(d);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s === '-0' ? '0' : s;
}
function fmtMoney(v, d) {
  d = d === undefined ? 0 : d;
  const s = Math.abs(v).toFixed(d);
  const parts = s.split('.');
  const ip = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v < 0 ? '−$' : '$') + ip + (parts[1] ? '.' + parts[1] : '');
}
function sci(v) {
  if (!Number.isFinite(v)) return '—';
  if (v === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(v)));
  const m = v / Math.pow(10, e);
  return fmt(m, 2) + ' × 10^' + e;
}
function parseUserNumber(str) {
  let s = String(str).trim().replace(/[$%,]/g, '').replace(/\s+/g, '').replace(/−/g, '-');
  if (!s) return NaN;
  if (!/^[0-9+\-*/().eE]+$/.test(s)) return NaN;
  try {
    const v = Function('"use strict";return (' + s + ')')();
    return Number.isFinite(v) ? v : NaN;
  } catch (e) { return NaN; }
}
function checkAnswer(user, answer, tol) {
  if (isNaN(user)) return false;
  switch (tol.kind) {
    case 'order':  return Math.abs(user - answer) < 1e-9;
    case 'rel':    return Math.abs(answer) < 1e-12 ? Math.abs(user) < (tol.pct || 1) / 100 : Math.abs(user - answer) / Math.abs(answer) <= (tol.pct || 1) / 100;
    case 'abs':    return Math.abs(user - answer) <= (tol.value || 0) + 1e-12;
    case 'factor': {
      if (answer === 0) return Math.abs(user) < 1e-9;
      const r = user / answer;
      const f = tol.value || 3;
      return r >= 1 / f && r <= f;
    }
    default: return false;
  }
}
function toleranceLabel(tol) {
  switch (tol.kind) {
    case 'order':  return 'exponent only';
    case 'factor': return 'within ×' + (tol.value || 3);
    case 'rel':    return 'within ' + (tol.pct || 1) + '%';
    case 'abs':    return 'within ±' + fmt(tol.value || 0, 4);
    case 'choice': return 'pick one';
    default: return '';
  }
}

/* ──────────────────────────────────────────────────────────
   storage
   ────────────────────────────────────────────────────────── */
const STORE_KEY = 'epis-approximation-v1';
const SEL_KEY = 'epis-approximation-selected-v1';
function emptyPerf() { return { topics: {}, totalAttempts: 0, totalCorrect: 0 }; }
function loadPerf() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyPerf();
    const p = JSON.parse(raw);
    if (!p || typeof p !== 'object') return emptyPerf();
    if (!p.topics) p.topics = {};
    if (typeof p.totalAttempts !== 'number') p.totalAttempts = 0;
    if (typeof p.totalCorrect !== 'number') p.totalCorrect = 0;
    return p;
  } catch (e) { return emptyPerf(); }
}

      prompt: (s.promptText || s.prompt).replace('{pa}', Math.round(pa * 100)).replace('{pbA}', Math.round(pbA * 100)).replace('{pbNotA}', Math.round(pbNotA * 100)),
      answerType: 'number', answer: ans, tolerance: s.tolerance, unit: s.unit,
      steps: (s.steps || []).map(t => t.replace('{pa}', Math.round(pa * 100)).replace('{pbA}', Math.round(pbA * 100))
        .replace('{pbNotA}', Math.round(pbNotA * 100)).replace('{paNot}', Math.round(paNot * 100))
        .replace('{pB}', fmt(pB * 100, 3)).replace('{ans}', fmt(ans, 2)))
    };
  },

  'ph-from': (s) => {
    const h = pick([1, 2, 5]) ;
    const e = pick([-2, -3, -4, -5, -6, -7]);
    const ans = -(Math.log10(h) + e);
    return {
      prompt: (s.promptText || s.prompt).replace('{h}', h).replace('{e}', String(e).replace('-', '−')),
      answerType: 'number', answer: ans, tolerance: s.tolerance, unit: s.unit,
      steps: (s.steps || []).map(t => t.replace('{h}', h).replace('{e}', String(e).replace('-', '−')).replace('{ans}', fmt(ans, 2)))
    };
  },

  'ph-dilute': (s) => {
    const ph = pick([2, 3, 4, 5, 6, 7]);
    const k = pick([10, 100, 1000]);
    const delta = Math.log10(k);
    const ans = ph + delta;
    return {
      prompt: (s.promptText || s.prompt).replace('{ph}', ph).replace('{k}', k),
      answerType: 'number', answer: ans, tolerance: s.tolerance, unit: s.unit,
      steps: (s.steps || []).map(t => t.replace('{ph}', ph).replace('{k}', k).replace('{delta}', delta).replace('{ans}', fmt(ans, 2)))
    };
  },

  'decibels': (s) => {
    const F = pick([10, 100, 1000, 2, 4, 10000]);
    const ans = 10 * Math.log10(F);
    return {
      prompt: (s.promptText || s.prompt).replace('{F}', F),
      answerType: 'number', answer: ans, tolerance: s.tolerance, unit: s.unit,
      steps: (s.steps || []).map(t => t.replace('{F}', F).replace('{ans}', fmt(ans, 2)))
    };
  }
};

/* ──────────────────────────────────────────────────────────
   state
   ────────────────────────────────────────────────────────── */
let DATA = null;
const state = {
  selected: new Set(),
  problem: null,
  answered: false,
  userAnswer: null,
  userChoice: null,
  sessionCorrect: 0,
  sessionAttempts: 0,
  sessionStreak: 0,
  prevScreen: 'home'
};
const $ = id => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
  state.screen = name;
}

/* ──────────────────────────────────────────────────────────
   home
   ────────────────────────────────────────────────────────── */
function renderHome() {
  const grid = $('topicGrid');
  grid.innerHTML = DATA.topics.map(t => {
    const sel = state.selected.has(t.id);
    return '<button class="topic-chip ' + (sel ? 'selected' : '') + '" data-topic="' + t.id + '" style="--c:' + t.color + '" type="button">' +
      '<span class="tc-icon">' + t.icon + '</span><span class="tc-name">' + t.name + '</span><span class="tc-check">✓</span></button>';
  }).join('');
  grid.querySelectorAll('.topic-chip').forEach(ch => ch.addEventListener('click', () => {
    const id = ch.dataset.topic;
    if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
    try { localStorage.setItem(SEL_KEY, JSON.stringify([...state.selected])); } catch (e) {}
    renderHome();
  }));
  const n = state.selected.size;
  $('selInfo').innerHTML = '<b>' + n + '</b> of ' + DATA.topics.length + ' topics selected';
  $('startBtn').disabled = n === 0;
  const a = perf.totalAttempts, c = perf.totalCorrect;
  $('overallText').innerHTML = a === 0 ? 'No attempts yet — pick topics and start.'
    : 'Overall: <b>' + c + '/' + a + '</b> correct &nbsp;·&nbsp; accuracy <b>' + fmt(c / a * 100, 1) + '%</b>';
}

/* ──────────────────────────────────────────────────────────
   practice
   ────────────────────────────────────────────────────────── */
function nextProblem() {
  const ids = [...state.selected].filter(id => DATA.topics.some(t => t.id === id));
  if (!ids.length) ids.push(DATA.topics[0].id);
  const topic = DATA.topics.find(t => t.id === pick(ids));
  const scheme = pick(topic.schemes);
  const gen = GENS[scheme.kind];
  if (!gen) {
    $('problemPrompt').innerHTML = 'No generator for kind <code>' + scheme.kind + '</code>.';
    return;
  }
  const inst = gen(Object.assign({}, scheme, { id: scheme.id, promptText: scheme.prompt }));
  state.problem = Object.assign(inst, { topicId: topic.id, topicName: topic.name, topicColor: topic.color, schemeId: scheme.id });
  state.answered = false; state.userAnswer = null; state.userChoice = null;
  renderPractice();
}

function renderPractice() {
  const p = state.problem;
  $('topicTag').style.setProperty('--c', p.topicColor);
  $('topicTagName').textContent = state.selected.size > 1 ? 'Mixed · ' + p.topicName : p.topicName;
  $('tolBadge').textContent = 'tolerance · ' + toleranceLabel(p.tolerance);
  $('problemPrompt').innerHTML = p.prompt;
  updateSession();
  const area = $('answerArea');
  if (p.answerType === 'choice') {
    area.innerHTML = '<div class="choices">' + p.choices.map((c, i) =>
      '<div class="choice" data-choice="' + i + '"><span class="radio"></span><span>' + c + '</span></div>').join('') + '</div>';
    area.querySelectorAll('.choice').forEach(el => el.addEventListener('click', () => {
      if (state.answered) return;
      state.userChoice = Number(el.dataset.choice);
      area.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }));
  } else {
    area.innerHTML = '<div class="num-input"><input id="answerInput" type="text" inputmode="decimal" placeholder="your answer" autocomplete="off" spellcheck="false"><div class="num-unit">' + (p.unit || '—') + '</div></div>' +
      '<div class="input-hint">expressions work: <code>72/6</code>, <code>1.5e3</code></div>';
    const inp = $('answerInput');
    setTimeout(() => inp.focus(), 30);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); } });
  }
  $('resultArea').innerHTML = '';
  renderActions();
}

function updateSession() {
  const a = state.sessionAttempts, c = state.sessionCorrect;
  $('sessionStats').innerHTML = a === 0 ? 'Session <b>0/0</b>'
    : 'Session <b>' + c + '/' + a + '</b> · ' + Math.round(c / a * 100) + '%' + (state.sessionStreak >= 2 ? ' · 🔥 ' + state.sessionStreak : '');
}

function renderActions() {
  const bar = $('actionBar');
  if (!state.answered) {
    bar.innerHTML = '<button class="primary" id="submitBtn">Submit answer</button><button class="ghost" id="skipBtn">Skip / show answer</button>';
    $('submitBtn').addEventListener('click', submitAnswer);
    $('skipBtn').addEventListener('click', () => { state.userAnswer = NaN; state.userChoice = null; evaluate(true); });
  } else {
    bar.innerHTML = '<button class="primary" id="nextBtn">Next problem →</button><button class="ghost" id="changeBtn">Change topics</button>';
    $('nextBtn').addEventListener('click', nextProblem);
    $('changeBtn').addEventListener('click', () => { renderHome(); showScreen('home'); });
    setTimeout(() => $('nextBtn') && $('nextBtn').focus(), 30);
  }
}

function submitAnswer() {
  if (state.answered) return;
  const p = state.problem;
  if (p.answerType === 'choice') {
    if (state.userChoice === null) return;
    state.userAnswer = state.userChoice;
  } else {
    const inp = $('answerInput');
    if (!inp || !inp.value.trim()) return;
    const v = parseUserNumber(inp.value);
    if (isNaN(v)) { $('resultArea').innerHTML = '<div class="feedback no">Could not read that as a number.</div>'; return; }
    state.userAnswer = v;
  }
  evaluate(false);
}

function evaluate(skipped) {
  const p = state.problem;
  const correct = !skipped && (p.answerType === 'choice'
    ? state.userAnswer === p.correctChoice
    : checkAnswer(state.userAnswer, p.answer, p.tolerance));

  state.answered = true;
  state.sessionAttempts++;
  if (correct) { state.sessionCorrect++; state.sessionStreak++; } else state.sessionStreak = 0;

  /* stats */
  if (!perf.topics[p.topicId]) perf.topics[p.topicId] = { attempts: 0, correct: 0, schemes: {} };
  const ts = perf.topics[p.topicId];
  ts.attempts++; if (correct) ts.correct++;
  if (!ts.schemes[p.schemeId]) ts.schemes[p.schemeId] = { attempts: 0, correct: 0 };
  ts.schemes[p.schemeId].attempts++; if (correct) ts.schemes[p.schemeId].correct++;
  perf.totalAttempts++; if (correct) perf.totalCorrect++;
  savePerf();

  if (p.answerType === 'choice') {
    $('answerArea').querySelectorAll('.choice').forEach(el => {
      el.classList.add('disabled');
      const i = Number(el.dataset.choice);
      if (i === p.correctChoice) el.classList.add('correct');
      else if (i === state.userAnswer && !correct) el.classList.add('wrong');
    });
  } else {
    const inp = $('answerInput');
    if (inp) { inp.disabled = true; inp.blur(); }
  }

  const shown = p.answerType === 'choice' ? p.choices[p.correctChoice]
    : fmt(p.answer, Math.abs(p.answer) < 10 ? 4 : 2) + (p.unit ? ' ' + p.unit : '');

  const fb = correct
    ? '<div class="feedback ok">✓ <b>Correct.</b></div>'
    : '<div class="feedback no">' + (skipped ? '↷ <b>Skipped.</b>' : '✗ <b>Not close enough.</b>') + ' The answer is <b>' + shown + '</b>.</div>';

  const steps = '<div class="steps-box"><h4>Detailed calculation</h4>' +
    (p.steps || []).map(s => '<div class="step-line">' + s + '</div>').join('') + '</div>';

  $('resultArea').innerHTML = fb + steps;
  updateSession();
  renderActions();
}

/* ──────────────────────────────────────────────────────────
   stats
   ────────────────────────────────────────────────────────── */
function renderStats() {
  const a = perf.totalAttempts, c = perf.totalCorrect;
  $('statsSummary').innerHTML =
    '<div class="sum-box"><div class="lab">Attempts</div><div class="val">' + a + '</div></div>' +
    '<div class="sum-box"><div class="lab">Correct</div><div class="val">' + c + '</div></div>' +
    '<div class="sum-box"><div class="lab">Accuracy</div><div class="val">' + (a ? fmt(c / a * 100, 1) + '%' : '—') + '</div></div>' +
    '<div class="sum-box"><div class="lab">Topics started</div><div class="val">' + Object.keys(perf.topics).length + '/' + DATA.topics.length + '</div></div>';

  if (a === 0) {
    $('statsTopics').innerHTML = '<div class="empty">No attempts yet — go back and practise a topic.</div>';
    return;
  }
  $('statsTopics').innerHTML = DATA.topics.map(t => {
    const ts = perf.topics[t.id];
    if (!ts) return '';
    const acc = ts.attempts ? Math.round(ts.correct / ts.attempts * 100) : 0;
    const schemes = Object.keys(ts.schemes).map(k => {
      const s = ts.schemes[k];
      return k + ': ' + s.correct + '/' + s.attempts;
    }).join(' · ');
    return '<div class="stat-topic" style="--c:' + t.color + '">' +
      '<div class="st-head"><div class="st-name">' + t.icon + ' ' + t.name + '</div>' +
      '<div class="st-meta"><b>' + ts.correct + '/' + ts.attempts + '</b> · ' + acc + '%</div></div>' +
      '<div class="st-bar"><div class="st-bar-fill" style="width:' + acc + '%"></div></div>' +
      (schemes ? '<div class="st-meta" style="margin-top:7px;font-size:10.5px;font-family:var(--font-mono)">' + schemes + '</div>' : '') +
      '<button class="ghost" data-reset="' + t.id + '" style="margin-top:8px;font-size:10.5px;padding:4px 9px">Reset</button></div>';
  }).join('');
  $('statsTopics').querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.reset;
    const ts = perf.topics[id];
    if (!ts) return;
    perf.totalAttempts -= ts.attempts;
    perf.totalCorrect -= ts.correct;
    delete perf.topics[id];
    savePerf(); renderStats(); renderHome();
  }));
}

/* ──────────────────────────────────────────────────────────
   wiring
   ────────────────────────────────────────────────────────── */
$('selectAllBtn').addEventListener('click', () => { state.selected = new Set(DATA.topics.map(t => t.id)); renderHome(); });
$('selectNoneBtn').addEventListener('click', () => { state.selected = new Set(); renderHome(); });
$('startBtn').addEventListener('click', () => {
  if (!state.selected.size) return;
  state.sessionCorrect = 0; state.sessionAttempts = 0; state.sessionStreak = 0;
  showScreen('practice'); nextProblem();
});
$('resetAllBtn').addEventListener('click', () => {
  if (!confirm('Reset ALL progress?')) return;
  perf = emptyPerf(); savePerf(); renderHome();
});
$('backBtn').addEventListener('click', () => { renderHome(); showScreen('home'); });
$('statsBtn').addEventListener('click', () => { state.prevScreen = 'home'; renderStats(); showScreen('stats'); });
$('statsBtn2').addEventListener('click', () => { state.prevScreen = 'practice'; renderStats(); showScreen('stats'); });
$('backStatsBtn').addEventListener('click', () => {
  if (state.prevScreen === 'practice' && state.problem) showScreen('practice');
  else { renderHome(); showScreen('home'); }
});
$('resetAllStatsBtn').addEventListener('click', () => {
  if (!confirm('Reset ALL progress?')) return;
  perf = emptyPerf(); savePerf(); renderStats(); renderHome();
});

document.addEventListener('keydown', e => {
  if (state.screen !== 'practice') return;
  if (e.key === 'Enter' && state.answered) {
    const ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT' && !ae.disabled) return;
    e.preventDefault(); nextProblem();
  }
});

/* theme */
(function () {
  var toggle = document.getElementById('themeToggle');
  var label = document.getElementById('themeLabel');
  function apply() { label.textContent = document.documentElement.dataset.theme === 'light' ? 'DARK' : 'LIGHT'; }
  toggle.addEventListener('click', function () {
    var root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('epistecnica-theme', root.dataset.theme); } catch (e) {}
    apply();
    window.dispatchEvent(new CustomEvent('epistecnica-theme'));
  });
  apply();
})();

/* ambient */
(function () {
  var cv = document.getElementById('ambientCanvas'), ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2), stars = [], W = 0, H = 0;
  function colors() {
    var s = getComputedStyle(document.documentElement);
    return { gold: s.getPropertyValue('--accent-gold').trim(), cyan: s.getPropertyValue('--accent-cyan').trim() };
  }
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round((W * H) / 26000);
    stars = [];
    for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, a: Math.random() * 0.5 + 0.15, s: Math.random() * 0.00012 + 0.00004, p: Math.random() * Math.PI * 2 });
  }
  function frame(t) {
    var c = colors();
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = Math.max(0.04, s.a * (0.55 + 0.45 * Math.sin(t * s.s + s.p)));
      ctx.fillStyle = i % 7 === 0 ? c.gold : c.cyan;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  resize(); window.addEventListener('resize', resize);
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
})();

/* boot: load the bank */
fetch('approximation-problems.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    /* validate the kinds before the first render */
    const missing = [];
    data.topics.forEach(t => t.schemes.forEach(s => { if (!GENS[s.kind]) missing.push(t.id + '/' + s.id + ' → ' + s.kind); }));
    if (missing.length) throw new Error('unknown generator kinds: ' + missing.join(', '));
    DATA = data;
    $('introText').textContent = data.intro;
    state.selected = new Set(data.topics.map(t => t.id));
    try {
      const raw = localStorage.getItem(SEL_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        const valid = new Set(arr.filter(id => data.topics.some(t => t.id === id && t.schemes && t.schemes.length)));
        state.selected = valid.size ? valid : new Set(data.topics.map(t => t.id));
      }
    } catch (e) {}
    renderHome();
    showScreen('home');
    if (typeof window.renderTeX === 'function') window.renderTeX();
  })
  .catch(err => {
    $('introText').innerHTML = '<span class="load-error">Could not load approximation-problems.json — ' + err.message + '</span>';
  });
</script>
