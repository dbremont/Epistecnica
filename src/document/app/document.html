<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document — Epistecnica</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem('epistecnica-theme') === 'light' ? 'light' : 'dark';</script>
    <meta name="description" content="Read a document from the Epistecnica documents corpus: papers, articles, books.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="documents.css">
    <script src="../note/vendor/marked.min.js"></script>
    <style>
        :root {
            --bg-void: #04050A;
            --bg-surface: #0B0D14;
            --bg-card: #11141D;
            --text-primary: #E2E4EB;
            --text-secondary: #8A8FA6;
            --text-muted: #737891;
            --accent-gold: #C5A467;
            --accent-cyan: #5BF0E7;
            --accent-cyan-dim: rgba(91, 240, 231, 0.1);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --card-bg: rgba(11, 13, 20, 0.72);
            --nav-bg: rgba(4, 5, 10, 0.82);
            --footer-bg: rgba(4, 5, 10, 0.7);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html[data-theme="light"] {
            --bg-void: #F7F5F0;
            --bg-surface: #F1EEE7;
            --bg-card: #FFFFFF;
            --text-primary: #1A1D24;
            --text-secondary: #4A4F5E;
            --text-muted: #7A7F8E;
            --accent-gold: #9A7B3F;
            --accent-gold-dim: rgba(154, 123, 63, 0.12);
            --accent-cyan: #0E7C72;
            --accent-cyan-dim: rgba(14, 124, 114, 0.08);
            --border-subtle: rgba(20, 22, 30, 0.10);
            --card-bg: rgba(255, 255, 255, 0.72);
            --nav-bg: rgba(247, 245, 240, 0.85);
            --footer-bg: rgba(247, 245, 240, 0.75);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; background: var(--bg-void); }

        body {
            background: var(--bg-void);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: opacity 180ms ease;
        }

        html.theme-fading body { opacity: 0; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            body { transition: none; }
        }

        #ambientCanvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.95rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-mark {
            height: 26px;
            width: auto;
        }

        .nav-brand em { font-style: italic; color: var(--accent-gold); }

        .nav-links { display: flex; gap: 1.2rem; }

        .nav-right { display: flex; align-items: center; gap: 0.8rem; }

        .theme-toggle {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.45rem 0.75rem;
            cursor: pointer;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .theme-toggle:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        .nav-links a {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--accent-cyan); }

        .layout {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2.5rem 2rem 3.5rem;
        }

        .cols {
            display: flex;
            gap: 2.5rem;
        }

        .note-main { flex: 9 1 0; min-width: 0; }

        .crumbs {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }

        .crumbs a { color: var(--text-muted); text-decoration: none; transition: color 0.3s ease; }
        .crumbs a:hover { color: var(--accent-cyan); }
        .crumbs .sep { margin: 0 0.5em; color: var(--text-muted); opacity: 0.5; }
        .crumbs .here { color: var(--accent-gold); }

        h1.note-title {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 2rem;
        }

        .note-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: -1.2rem 0 2rem;
            position: relative;
            top: 0.8rem;
        }

        .chip {
            font-family: var(--font-mono);
            font-size: 0.58rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.35rem 0.7rem;
            text-decoration: none;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        a.chip:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        button.chip { cursor: pointer; }
        button.chip:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        /* ---------- history modal (per-file changelog) ---------- */
        .hist-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 10, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .hist-overlay.open { opacity: 1; pointer-events: auto; }
        .hist-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -48%) scale(0.96);
            width: min(560px, 92vw);
            max-height: 82vh;
            background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-void) 100%);
            border: 1px solid var(--border-medium);
            border-left: 2px solid var(--accent-gold);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            z-index: 610;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .hist-modal.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .hist-header {
            padding: 1.2rem 1.4rem 1rem;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
            flex-shrink: 0;
        }
        .hist-eyebrow {
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-style: italic;
            color: var(--accent-gold);
            letter-spacing: 0.06em;
            display: block;
        }
        .hist-title {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 1.4rem;
            margin-top: 0.2rem;
            word-break: break-word;
        }
        .hist-close {
            position: absolute;
            top: 0.9rem; right: 1.1rem;
            background: none;
            border: 0;
            color: var(--text-muted);
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
        }
        .hist-close:hover { color: var(--text-primary); }
        .hist-body { padding: 0.4rem 1.4rem 1.2rem; overflow-y: auto; }
        .hist-row { padding: 0.7rem 0; border-bottom: 1px solid var(--border-subtle); }
        .hist-row:last-child { border-bottom: 0; }
        .hist-meta {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .hist-meta .k {
            color: var(--text-primary);
            border: 1px solid var(--border-medium);
            border-radius: 999px;
            padding: 0.05rem 0.45rem;
            margin-left: 0.5rem;
        }
        .hist-text { font-size: 0.85rem; line-height: 1.55; color: var(--text-secondary); }
        .hist-links {
            margin-top: 0.35rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.8rem;
            font-family: var(--font-mono);
            font-size: 0.68rem;
        }
        .hist-links a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
        .hist-links a:hover { text-decoration: underline; }
        .hist-links .sep { color: var(--text-muted); }
        @media (prefers-reduced-motion: reduce) {
            .hist-overlay, .hist-modal { transition: none; }
        }

        /* ---------- QA modal (front-matter questions) ---------- */
        .qa-list {
            list-style: none;
            margin: 0.2rem 0 0;
            padding: 0;
        }
        .qa-list li {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.55;
        }
        .qa-list li:last-child { border-bottom: 0; }

        .note-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 2.5rem;
            backdrop-filter: blur(6px);
        }

        .sidebar {
            flex: 1 1 0;
            min-width: 180px;
            position: sticky;
            top: 3.5rem;
            height: fit-content;
            max-height: calc(100vh - 5rem);
            overflow-y: auto;
            padding: 0 1.25rem 0 0;
        }

        .sidebar-title {
            font-family: var(--font-mono);
            font-size: 0.58rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.9rem;
            text-align: right;
        }

        .toc-item {
            display: block;
            font-size: 0.78rem;
            font-weight: 300;
            color: var(--text-secondary);
            text-decoration: none;
            text-align: right;
            padding: 0.3rem 0.75rem 0.3rem 0;
            border-right: 1px solid transparent;
            margin-right: -1.25rem;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .toc-item.sub { padding-right: 1.6rem; font-size: 0.74rem; color: var(--text-muted); }

        .toc-item:hover { color: var(--text-primary); }
        .toc-item.active { color: var(--accent-cyan); border-right-color: var(--accent-cyan); }

        .state {
            text-align: center;
            padding: 5rem 2rem;
            border: 1px solid var(--border-subtle);
            background: var(--bg-void);
        }

        .state .title {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 1.6rem;
            margin-bottom: 0.8rem;
        }

        .state .msg { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.6rem; }

        .state a.back {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.55rem 0.9rem;
            text-decoration: none;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .state a.back:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        footer {
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border-subtle);
            background: var(--footer-bg);
        }

        .foot-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .foot-inner a { color: var(--text-muted); text-decoration: none; transition: color 0.3s ease; }
        .foot-inner a:hover { color: var(--accent-cyan); }

        @media (max-width: 900px) {
            .sidebar { display: none; }
            .note-card { padding: 1.5rem; }
        }
    </style>
    <link rel="stylesheet" href="../shared/usearch.css">
</head>
<body>
    <canvas id="ambientCanvas" aria-hidden="true"></canvas>

    <nav class="nav">
        <div class="nav-inner">
            <a class="nav-brand" href="../"><img class="nav-mark" src="../img/mark-alpha.png" alt="">Episte<em>cnica</em></a>
            <div class="nav-right">
                <div class="usearch-wrap">
                    <svg class="usearch-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" id="usearch" placeholder="search everything…  ( / · r dice )" aria-label="Universal search" role="combobox" aria-expanded="false" aria-controls="usearch-drop" aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off">
                    <button type="button" id="usurprise" title="Surprise me — open a random entry (r)" aria-label="Open a random entry" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/></svg></button>
                    <div class="usearch-drop" id="usearch-drop" role="listbox" aria-label="Search results" hidden></div>
                </div>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch color theme">◐ <span id="themeLabel">LIGHT</span></button>
            </div>
        </div>
    </nav>

    <div class="layout">
        <div class="note-header" id="note-header" hidden>
            <div class="crumbs" id="crumbs"></div>
            <h1 class="note-title" id="note-title"></h1>
            <div class="note-meta">
                <span class="chip" id="meta-words"></span>
                <span class="chip" id="meta-time"></span>
                <a class="chip" id="meta-raw" href="#">view raw</a>
                <button class="chip" id="meta-qa" hidden>QA</button>
                <button class="chip" id="meta-history" hidden>history</button>
            </div>
        </div>

        <div class="cols">
            <main class="note-main">
                <div class="state" id="loading">
                    <div class="title">Loading&hellip;</div>
                </div>

                <div class="state" id="error" hidden>
                    <div class="title">Document not found.</div>
                    <div class="msg" id="errorMsg"></div>
                    <a class="back" href="index.html">&larr; Catalog</a>
                </div>

                <article class="note-card" id="note-card" hidden>
                    <div class="markdown-body" id="note-body"></div>
                </article>
            </main>

            <aside class="sidebar" id="sidebar" hidden>
                <div class="sidebar-title">Contents</div>
                <nav id="toc"></nav>
            </aside>
        </div>
    </div>

    <footer>
        <div class="foot-inner">
            <div>Episte<em style="color:var(--accent-gold);font-style:italic">cnica</em> &middot; documents</div>
            <a href="index.html">&larr; CATALOG</a>
        </div>
    </footer>

    <div class="hist-overlay" id="qa-overlay"></div>
    <div class="hist-modal" id="qa-modal" role="dialog" aria-modal="true" aria-label="Questions">
        <div class="hist-header">
            <span class="hist-eyebrow">QA</span>
            <h3 class="hist-title" id="qa-title">Questions</h3>
            <button class="hist-close" id="qa-close" aria-label="Close questions">&times;</button>
        </div>
        <div class="hist-body"><ul class="qa-list" id="qa-list"></ul></div>
    </div>

    <div class="hist-overlay" id="hist-overlay"></div>
    <div class="hist-modal" id="hist-modal" role="dialog" aria-modal="true" aria-label="History">
        <div class="hist-header">
            <span class="hist-eyebrow">History</span>
            <h3 class="hist-title" id="hist-title">Changelog</h3>
            <button class="hist-close" id="hist-close" aria-label="Close history">&times;</button>
        </div>
        <div class="hist-body" id="hist-body"></div>
    </div>

    <script src="../shared/viewer.js" data-kind="document"></script>
    <script src="../shared/usearch.js" data-root="../"></script>
    <script src="http://localhost:8013/glossarium/web/js/glossarium-lookup.js" data-glossarium="http://localhost:8013/glossarium/data/index.json" defer></script>
</body>
</html>
